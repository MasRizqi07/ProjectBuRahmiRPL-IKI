<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>On-Site Ticket Redemption Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "war-gold": "#F0B429",
                        "inverse-primary": "#7b5900",
                        "tertiary-fixed": "#c3e8ff",
                        "on-primary-fixed": "#261900",
                        "tertiary-container": "#5bc9ff",
                        "on-secondary-container": "#b7b5b4",
                        "on-tertiary": "#003549",
                        "secondary-container": "#474746",
                        "secondary": "#c8c6c5",
                        "surface-container": "#201f1f",
                        "background": "#131313",
                        "on-primary-fixed-variant": "#5d4200",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-background": "#e5e2e1",
                        "outline-variant": "#504534",
                        "text-secondary": "#666666",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#e5e2e1",
                        "primary": "#ffd481",
                        "surface-variant": "#353534",
                        "surface-grey": "#1A1A1A",
                        "on-secondary-fixed-variant": "#474746",
                        "inverse-surface": "#e5e2e1",
                        "on-error": "#690005",
                        "status-green": "#10B981",
                        "on-secondary": "#313030",
                        "on-primary-container": "#644800",
                        "tertiary": "#aee0ff",
                        "outline": "#9c8f7a",
                        "brand-glow": "rgba(240, 180, 41, 0.1)",
                        "on-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "primary-fixed": "#ffdea4",
                        "primary-fixed-dim": "#fabd32",
                        "on-primary": "#412d00",
                        "on-surface-variant": "#d4c5ad",
                        "urgent-red": "#EF4444",
                        "on-tertiary-fixed-variant": "#004c69",
                        "surface-container-high": "#2a2a2a",
                        "surface-dim": "#131313",
                        "text-primary": "#FFFFFF",
                        "surface": "#131313",
                        "inverse-on-surface": "#313030",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-highest": "#353534",
                        "on-tertiary-container": "#005371",
                        "error-container": "#93000a",
                        "surface-bright": "#3a3939",
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-container": "#f0b429",
                        "tertiary-fixed-dim": "#7ad0ff",
                        "surface-tint": "#fabd32",
                        "on-tertiary-fixed": "#001e2c",
                        "surface-container-lowest": "#0e0e0e"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "container-max": "1280px"
                    },
                    fontFamily: {
                        "display-lg": ["Bebas Neue"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-md": ["Bebas Neue"],
                        "body-md": ["Plus Jakarta Sans"],
                        "display-xl": ["Bebas Neue"],
                        "headline-lg": ["Bebas Neue"],
                        "display-xl-mobile": ["Bebas Neue"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "display-lg": ["48px", { lineHeight: "48px", letterSpacing: "0.02em", fontWeight: "700" }],
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "display-md": ["32px", { lineHeight: "32px", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-xl": ["80px", { lineHeight: "80px", letterSpacing: "0.02em", fontWeight: "700" }],
                        "headline-lg": ["24px", { lineHeight: "28px", fontWeight: "400" }],
                        "display-xl-mobile": ["36px", { lineHeight: "40px", fontWeight: "700" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scan-line {
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-war-gold selection:text-background overflow-hidden">
<!-- Task-Focused Header (Suppressed global nav as per semantic mapping rules) -->
<header class="flex justify-between items-center w-full px-margin-mobile py-4 bg-surface/90 backdrop-blur-xl border-b border-white/10 z-50 sticky top-0">
<button class="text-on-surface-variant hover:text-war-gold transition-colors flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-display-md text-display-md text-war-gold tracking-tight leading-none uppercase">SCANNER</h1>
<span class="font-label-sm text-label-sm text-status-green flex items-center gap-1 mt-1">
<span class="w-2 h-2 rounded-full bg-status-green animate-pulse"></span>
                SYSTEM ONLINE
            </span>
</div>
<button class="text-on-surface-variant hover:text-war-gold transition-colors flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined">flash_on</span>
</button>
</header>
<!-- Main Scanner Canvas -->
<main class="flex-1 relative flex flex-col items-center justify-start bg-black">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 opacity-40 z-0 flex items-center justify-center overflow-hidden">
<!-- Placeholder for actual camera feed -->
<div class="w-full h-full bg-surface-container-highest bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-variant to-background opacity-50"></div>
</div>
<!-- Scanner Viewfinder -->
<div class="relative w-full max-w-sm aspect-square mt-12 z-10 flex items-center justify-center p-8">
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-war-gold rounded-tl-xl opacity-80"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-war-gold rounded-tr-xl opacity-80"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-war-gold rounded-bl-xl opacity-80"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-war-gold rounded-br-xl opacity-80"></div>
<!-- Scanning Animation -->
<div class="relative w-full h-full overflow-hidden rounded-lg bg-brand-glow/5">
<div class="absolute left-0 w-full h-1 bg-war-gold shadow-[0_0_20px_4px_rgba(240,184,41,0.6)] animate-scan-line"></div>
<!-- Simulated QR target hint -->
<div class="absolute inset-0 flex items-center justify-center opacity-20">
<span class="material-symbols-outlined text-[120px] text-war-gold">qr_code_scanner</span>
</div>
</div>
</div>
<p class="font-body-md text-text-secondary mt-6 z-10 text-center px-8">Align QR code within the frame to verify.</p>
<!-- Dynamic Status Display (Bottom Sheet / Glass Card) -->
<!-- Simulated State: Success Verification -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container/95 backdrop-blur-2xl border-t border-status-green/30 rounded-t-2xl p-6 shadow-[0_-10px_40px_rgba(16,185,129,0.15)] z-20 transform transition-transform duration-300">
<!-- Indicator Pill -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-6"></div>
<!-- Status Header -->
<div class="flex items-center justify-center gap-3 mb-6 bg-status-green/10 border border-status-green/50 py-3 px-6 rounded-lg">
<span class="material-symbols-outlined text-status-green text-[32px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h2 class="font-display-md text-display-md-mobile text-status-green uppercase tracking-wide m-0 leading-none mt-1">ACCESS GRANTED</h2>
</div>
<!-- Attendee Details Bento -->
<div class="grid grid-cols-2 gap-3 mb-6">
<div class="bg-surface-container-highest p-4 rounded-xl border border-white/5">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-1 uppercase">Attendee</span>
<p class="font-body-md text-body-lg text-text-primary font-bold">ALEXANDER W.</p>
</div>
<div class="bg-surface-container-highest p-4 rounded-xl border border-white/5">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-1 uppercase">Ticket Type</span>
<p class="font-body-md text-body-lg text-war-gold font-bold">VIP FLOOR</p>
</div>
<div class="bg-surface-container-highest p-4 rounded-xl border border-white/5">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-1 uppercase">Seat No.</span>
<p class="font-display-md text-display-md-mobile text-text-primary leading-none">A-42</p>
</div>
<div class="bg-surface-container-highest p-4 rounded-xl border border-white/5">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-1 uppercase">NIK (Last 4)</span>
<p class="font-body-md text-body-lg text-text-primary font-bold">**** 8921</p>
</div>
</div>
<!-- Action Area -->
<button class="w-full bg-war-gold text-on-primary font-label-sm text-label-sm uppercase py-4 rounded-xl shadow-[0_0_15px_rgba(240,184,41,0.2)] hover:bg-primary hover:scale-[1.02] active:scale-95 transition-all duration-200">
                Acknowledge &amp; Scan Next
            </button>
</div>
</main>
</body></html>
